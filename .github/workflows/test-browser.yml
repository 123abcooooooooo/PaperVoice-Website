name: Test PaperVoice PDF to MP3 in browser
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QR fixture and browser test requirements
        run: |
          python -m pip install -U pip
          python -m pip install playwright "qrcode[pil]" reportlab
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg for sample codec generation
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate four-code dense PaperVoice test PDF
        run: python tests/generate_fixture.py tests/test_sheet.pdf
      - name: Start local static website
        run: |
          python -m http.server 8000 --directory docs >/tmp/papervoice-http.log 2>&1 &
          sleep 2
      - name: Verify homepage and all three application routes
        run: python tests/test_home.py
      - name: Exercise upload, QR scan, Codec2 decode and MP3 export
        run: python tests/test_browser.py
      - name: Verify newly generated QR sheet can be restored as MP3
        run: python tests/test_create.py
      - name: Verify exact bit-perfect MP3 recovered from printed QR PDF
        run: python tests/test_exact.py
      - name: Upload screenshot on test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-voice-browser-failure
          path: |
            tests/homepage_failure.png
            tests/browser_failure.png
            tests/create_browser_failure.png
            tests/exact_browser_failure.png
          if-no-files-found: ignore
