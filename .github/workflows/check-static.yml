name: Check static PaperVoice website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check docs/app.js
      - name: Confirm GitHub Pages files exist
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/.nojekyll
          ! grep -q '/api/decode' docs/app.js
